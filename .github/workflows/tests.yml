name: "Tests"
on:
  workflow_dispatch:

jobs:
  Test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # Upstream matrix ['lts/*', 'node'] collapsed to a single pinned Node 16 leg:
          # the pinned dev toolchain (rollup@2.49.0 engines node>=10, eslint@7.27.0)
          # hard-fails on the Node 8 leg the harness matrix names, and floating
          # labels like 'lts/*' / 'node' are not reproducible.
          node-version: 16
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        run: npm run test:specs

  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # Same pinned Node 16 leg as the Test job (see note above).
          node-version: 16
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: npm run build
      - name: Pack 📦
        run: npm pack
      - name: Upload Artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: marked-tgz
          path: marked-*.tgz
